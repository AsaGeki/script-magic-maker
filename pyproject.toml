[project]
name = "script-magic-maker"
version = "0.1.0"
description = "Gera cartas de Magic: The Gathering em português e em resolução de impressão"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "img2pdf>=0.6.3",
    "pillow>=10.4.0,<11",
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.0",
    "rich>=13.9.0",
    "term-image>=0.7.2",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
script-magic-maker = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
